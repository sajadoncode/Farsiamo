<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="w-[340px] bg-zinc-50 p-4 font-sans text-zinc-900 antialiased">
  <header class="mb-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="grid size-10 place-items-center rounded-xl bg-zinc-900 text-base font-bold text-emerald-300 shadow-sm">فا</span>
      <div>
        <h1 class="text-[17px] font-bold leading-none tracking-tight">فارسیامو</h1>
        <p class="mt-1.5 text-[11px] leading-none text-zinc-500">فونت فارسی در گفتگوهای هوش مصنوعی</p>
      </div>
    </div>
    <label class="relative inline-flex cursor-pointer items-center" title="فعال‌سازی افزونه">
      <input type="checkbox" id="enabled" class="peer sr-only">
      <span class="block h-6 w-11 rounded-full bg-zinc-300 transition-colors duration-200 peer-checked:bg-emerald-600 peer-focus-visible:ring-2 peer-focus-visible:ring-emerald-600 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-zinc-50 after:absolute after:start-0.5 after:top-0.5 after:size-5 after:rounded-full after:bg-white after:shadow after:transition-transform after:duration-200 after:content-[''] peer-checked:after:-translate-x-5"></span>
    </label>
  </header>

  <main>
    <section class="rounded-2xl bg-white p-3.5 shadow-sm ring-1 ring-zinc-200/80">
      <label for="font-select" class="mb-2 block text-xs font-medium text-zinc-500">انتخاب فونت</label>
      <div class="relative">
        <select id="font-select" class="w-full cursor-pointer appearance-none rounded-xl border-0 bg-zinc-50 py-2.5 pe-10 ps-3.5 text-[15px] text-zinc-900 ring-1 ring-inset ring-zinc-200 transition hover:ring-zinc-300 focus:outline-none focus:ring-2 focus:ring-emerald-600"></select>
        <svg class="pointer-events-none absolute inset-y-0 end-3 my-auto size-4 text-zinc-400" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg>
      </div>
      <p id="font-sample" class="mt-3 rounded-xl bg-zinc-50 px-3.5 py-3 text-lg leading-8 text-zinc-700">نمونه متن فارسی ۱۲۳</p>
    </section>

    <section class="mt-3 flex items-center justify-between rounded-2xl bg-white p-3.5 shadow-sm ring-1 ring-zinc-200/80" aria-live="polite">
      <div class="min-w-0">
        <span class="block text-[11px] text-zinc-500">سرویس باز فعلی</span>
        <strong id="active-name" class="mt-1 block text-sm font-bold">در حال بررسی…</strong>
      </div>
      <span id="active-icon" class="grid size-10 place-items-center rounded-xl bg-zinc-100 text-[11px] font-bold text-zinc-500">AI</span>
    </section>

    <p class="mb-2 mt-5 px-1 text-xs font-medium text-zinc-500">سرویس‌های پشتیبانی‌شده</p>
    <section id="services" class="grid grid-cols-5 gap-2" aria-label="سرویس‌های پشتیبانی‌شده"></section>
  </main>

  <p id="footer-message" class="mt-4 px-1 text-[11px] leading-5 text-zinc-400">برای اعمال فونت، افزونه را روشن نگه دارید.</p>
  <script src="fonts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
