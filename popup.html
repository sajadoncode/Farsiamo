<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="relative w-[340px] bg-gray-950 font-sans text-white antialiased [color-scheme:dark]">
  <div class="hatch pointer-events-none absolute inset-y-0 start-0 w-4 border-e border-white/10" aria-hidden="true"></div>
  <div class="hatch pointer-events-none absolute inset-y-0 end-0 w-4 border-s border-white/10" aria-hidden="true"></div>

  <header class="relative flex items-center justify-between border-b border-white/10 px-8 py-5">
    <div class="flex items-center gap-3">
      <span class="grid size-9 place-items-center rounded-lg bg-white text-base font-bold text-gray-950">فا</span>
      <div>
        <h1 class="text-base font-bold leading-none tracking-tighter">فارسیامو</h1>
        <p class="mt-1.5 text-[10px] leading-none text-gray-400">فونت فارسی در گفتگوهای هوش مصنوعی</p>
      </div>
    </div>
    <label class="relative inline-flex cursor-pointer items-center" title="فعال‌سازی افزونه">
      <input type="checkbox" id="enabled" class="peer sr-only">
      <span class="block h-6 w-11 rounded-full bg-gray-700 transition-colors duration-200 peer-checked:bg-sky-500 peer-focus-visible:ring-2 peer-focus-visible:ring-sky-400 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-gray-950 after:absolute after:start-0.5 after:top-0.5 after:size-5 after:rounded-full after:bg-white after:shadow after:transition-transform after:duration-200 after:content-[''] peer-checked:after:-translate-x-5"></span>
    </label>
  </header>

  <section class="relative border-b border-white/10 px-8 py-5">
    <label for="font-select" class="mb-2 block text-xs font-semibold">انتخاب فونت</label>
    <div class="relative">
      <select id="font-select" class="w-full cursor-pointer appearance-none rounded-lg border border-white/15 bg-gray-900 py-2 pe-10 ps-3 text-[13px] text-white transition hover:border-white/30 focus:border-sky-400 focus:outline-none focus:ring-1 focus:ring-sky-400"></select>
      <svg class="pointer-events-none absolute inset-y-0 end-3 my-auto size-4 text-gray-400" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg>
    </div>
  </section>

  <section class="relative pb-8 pt-5">
    <p class="mb-4 px-8 text-xs font-semibold">سرویس‌های پشتیبانی‌شده</p>
    <div id="services" class="mx-4 grid grid-cols-4 gap-px border-y border-white/10 bg-white/10" aria-label="سرویس‌های پشتیبانی‌شده"></div>
  </section>

  <section id="site-section" hidden class="relative border-t border-white/10 px-8 py-5">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p id="site-message" class="text-xs font-semibold"></p>
        <p id="site-host" dir="ltr" class="mt-1 truncate text-right text-[11px] text-gray-400"></p>
      </div>
      <button id="site-button" type="button"></button>
    </div>
  </section>

  <script src="fonts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
